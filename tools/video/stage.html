<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hooman in the Loop: user guide stage</title>
<style>
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url(/app/fonts/atkinson-400.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url(/app/fonts/atkinson-700.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(/app/fonts/jetbrains-500.woff2) format("woff2"); }
  :root { --ground: #0d1214; --card: #161e21; --line: #26333a; --text: #e8f0f2; --muted: #8fa3aa; --focus: #b9e3ff; --lime: #c6ff3d; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(1100px 800px at 74% 46%, #182a30 0%, var(--ground) 62%); color: var(--text); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  .left { position: absolute; left: 130px; top: 100px; width: 900px; height: 880px; }
  .brand { display: flex; gap: 18px; align-items: center; font-size: 28px; color: var(--muted); }
  .brand img { width: 56px; height: 56px; border-radius: 14px; }
  .chapter { margin-top: 150px; font: 500 22px "JetBrains Mono", monospace; color: var(--focus); letter-spacing: .08em; text-transform: uppercase; min-height: 28px; }
  .title { margin-top: 20px; font-size: 76px; font-weight: 700; line-height: 1.06; min-height: 170px; transition: opacity .35s; }
  .sub { position: absolute; left: 0; bottom: 70px; width: 880px; font-size: 34px; line-height: 1.38; min-height: 150px; color: #dfe9ec; transition: opacity .25s; }
  .dots { position: absolute; left: 0; bottom: 0; display: flex; gap: 10px; }
  .dots i { width: 34px; height: 6px; border-radius: 3px; background: var(--line); }
  .dots i.on { background: var(--focus); }
  .phone { position: absolute; left: 1290px; top: 112px; width: 390px; height: 844px; border-radius: 46px; overflow: hidden; background: #000;
           box-shadow: 0 0 0 12px #1b2427, 0 0 0 14px #2c3a40, 0 40px 90px rgba(0,0,0,.65); }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .finger { position: absolute; left: 0; top: 0; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; z-index: 10; pointer-events: none;
            background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.9); box-shadow: 0 0 22px rgba(255,255,255,.35); opacity: 0;
            transition: opacity .2s, transform .12s; }
  .finger.down { transform: scale(.78); background: rgba(198,255,61,.5); border-color: var(--lime); }
  .card { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          background: radial-gradient(900px 700px at 50% 45%, #182a30 0%, var(--ground) 70%); opacity: 0; transition: opacity .7s; pointer-events: none; }
  .card.on { opacity: 1; }
  .card img { width: 210px; height: 210px; border-radius: 48px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .card h1 { font-size: 104px; margin: 46px 0 8px; }
  .card p { font-size: 46px; color: var(--muted); margin: 6px 0; }
  .card .url { font: 500 40px "JetBrains Mono", monospace; color: var(--focus); margin-top: 36px; }
  .phone { transition: opacity .5s; }
  .phone.off { opacity: 0; }
  .chat { pointer-events: none; position: absolute; left: 1090px; top: 120px; width: 720px; height: 840px; display: flex; flex-direction: column; gap: 22px; justify-content: center; opacity: 0; transition: opacity .5s; }
  .chat.on { opacity: 1; }
  .msg { border-radius: 22px; padding: 20px 24px; font-size: 25px; line-height: 1.4; opacity: 0; transform: translateY(14px); transition: opacity .4s, transform .4s; }
  .msg.show { opacity: 1; transform: none; }
  .msg b { display: block; font: 500 16px "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .msg.you { background: #1b3442; align-self: flex-end; width: 600px; border-bottom-right-radius: 6px; }
  .msg.you b { color: var(--focus); }
  .msg.ai { background: var(--card); border: 1px solid var(--line); width: 680px; border-bottom-left-radius: 6px; }
  .msg.ai b { color: var(--lime); }
  .term { margin-top: 14px; background: #070a0b; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font: 500 17px/1.5 "JetBrains Mono", monospace; color: #cfe3d6; white-space: pre-wrap; min-height: 40px; }
  .term .cmd { color: var(--focus); }
</style>
</head>
<body>
<div class="left">
  <div class="brand"><img src="/app/icons/icon-192.png" alt="">Hooman in the Loop · user guide</div>
  <div class="chapter" id="chapter"></div>
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
  <div class="dots" id="dots"></div>
</div>
<div class="phone"><iframe id="phone" name="phone" src="/app/index.html"></iframe></div>
<div class="chat" id="chat"></div>
<div class="finger" id="finger"></div>
<div class="card on" id="card"><img src="/app/icons/icon-512.png" alt=""><h1>Hooman in the Loop</h1><p id="cardsub">The AI guesses. The hooman decides.</p><div class="url" id="cardurl"></div></div>
<script>
  const $ = (id) => document.getElementById(id);
  let subTimers = [];
  window.stage = {
    chapter(i, n, name, title) {
      $("chapter").textContent = `${i + 1} / ${n} · ${name}`;
      $("title").innerHTML = title;
      $("dots").innerHTML = Array.from({ length: n }, (_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("");
    },
    // [[ms from now, sentence], ...]
    subtitles(list) {
      subTimers.forEach(clearTimeout); subTimers = [];
      $("sub").textContent = "";
      for (const [ms, text] of list) subTimers.push(setTimeout(() => { $("sub").textContent = text; }, ms));
    },
    card(on, sub, url) {
      if (sub !== undefined) $("cardsub").textContent = sub;
      if (url !== undefined) $("cardurl").textContent = url;
      $("card").classList.toggle("on", !!on);
    },
    finger(x, y, show = true) {
      const f = $("finger");
      f.style.transition = "opacity .2s, transform .12s";
      f.style.left = `${x}px`; f.style.top = `${y}px`; f.style.opacity = show ? "1" : "0";
    },
    press(on) { $("finger").classList.toggle("down", on); },
    glide(x, y, ms) {
      const f = $("finger");
      f.style.transition = `opacity .2s, transform .12s, left ${ms}ms linear, top ${ms}ms linear`;
      f.style.left = `${x}px`; f.style.top = `${y}px`;
    },
    hide() { $("finger").style.opacity = "0"; },
    part(label) { document.querySelector(".brand").lastChild.textContent = `Hooman in the Loop · ${label}`; },
    // messages: [{who: "you" | "ai", name, text, term: [lines], at: ms}]; null hides the chat and shows the phone again
    chat(messages) {
      const box = $("chat"), phone = document.querySelector(".phone");
      subTimers.push(...[]);
      if (!messages) { box.classList.remove("on"); phone.classList.remove("off"); return; }
      box.innerHTML = ""; box.classList.add("on"); phone.classList.add("off"); $("finger").style.opacity = "0";
      for (const m of messages) {
        const el = document.createElement("div");
        el.className = `msg ${m.who}`;
        el.innerHTML = `<b>${m.name}</b><span></span>${m.term ? '<div class="term"></div>' : ""}`;
        el.querySelector("span").textContent = m.text;
        box.appendChild(el);
        setTimeout(() => {
          el.classList.add("show");
          const term = el.querySelector(".term");
          if (!term) return;
          let t = 500;
          for (const line of m.term) {
            setTimeout(() => {
              const d = document.createElement("div");
              if (line.startsWith("$ ")) d.className = "cmd";
              d.textContent = line; term.appendChild(d);
            }, t);
            t += line.startsWith("$ ") ? 900 : 380;
          }
        }, m.at || 0);
      }
    },
  };
</script>
</body>
</html>
